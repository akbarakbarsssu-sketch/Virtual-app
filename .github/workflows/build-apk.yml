name: Build VirtualApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VirtualApp_16-main.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q VirtualApp_16-main.zip -d source
          find source -name gradlew -type f

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -name gradlew -type f -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
